name: CI

# Pushes and pull requests run offline. The checks that touch the network — confirming the pins
# in harper_ls.py still match the real Harper release — live in the scheduled job at the bottom,
# so a pull request can never go red because github.com was slow.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Monday, off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.14 is what Hermes itself ships on, so
        # the backend has to keep importing there too.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install check tools
        run: |
          python -m pip install --upgrade pip
          # The plugin declares no runtime dependencies (python_runtime: external). These are the
          # libraries the backend imports when Hermes loads it, plus the test tooling.
          python -m pip install pytest ruff pyyaml "httpx>=0.27" fastapi pydantic

      - name: Ruff
        run: ruff check .

      - name: Byte-compile
        run: python -m compileall -q harper_ls.py dashboard scripts tests

      - name: Tests
        run: python -m pytest

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check desktop/plugin.js
        run: node --check desktop/plugin.js

  release-pins:
    # A drifted pin breaks the install for every user at once, and it stays silent until someone
    # presses the button. Comparing the table against the live release turns that into a red X.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest pyyaml "httpx>=0.27" fastapi pydantic

      - name: Compare harper_ls.py against the live Harper release
        env:
          HARPER_PIN_TEST: "1"
        run: python -m pytest tests/test_harper_ls.py -v

      - name: Download the runner's asset and check it, writing nothing
        run: python scripts/fetch_harper_ls.py --verify-only
