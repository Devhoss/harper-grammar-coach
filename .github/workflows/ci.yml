name: CI

# Pushes and pull requests install test tooling and run the suites, and nothing they do depends
# on the outside world answering: the checks that confirm the pins in harper_ls.py still match
# the real Harper release live in the scheduled job at the bottom, so a pull request can never
# go red because github.com was slow.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Monday, off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.14 is what Hermes itself ships on, so
        # the backend has to keep importing there too.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - name: Install locked check tools
        run: uv sync --locked --extra dev

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Byte-compile
        run: .venv/bin/python -m compileall -q harper_ls.py dashboard scripts tests

      - name: Tests
        run: .venv/bin/python -m pytest

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 21+ for `node --test` glob patterns. The plugin itself ships no JavaScript
          # dependency — these are dev-only, for loading desktop/plugin.js under a stub SDK.
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm ci

      - name: Syntax-check desktop/plugin.js
        run: node --check desktop/plugin.js

      - name: Renderer tests
        run: npm test

  release-pins:
    # A drifted pin breaks the install for every user at once, and it stays silent until someone
    # presses the button. Comparing the table against the live release turns that into a red X.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked test tools
        run: uv sync --locked --extra dev

      - name: Compare harper_ls.py against the live Harper release
        env:
          HARPER_PIN_TEST: "1"
        run: .venv/bin/python -m pytest tests/test_harper_ls.py -v

      - name: Download the runner's asset and check it, writing nothing
        run: .venv/bin/python scripts/fetch_harper_ls.py --verify-only
