name: Hermes validation

# ``hermes plugins validate`` is Hermes' own admission gate for a plugin directory: manifest shape,
# loadability, the declared-vs-registered capability probe, the security scanner, the core-override
# check and the desktop-surface lint. A pull request here that fails this job would fail the same
# way the moment someone tries to install the plugin, which is exactly why it runs against the
# upstream Hermes checkout rather than a copy of its rules.

on:
  push:
    branches: [main, release-candidate]
  pull_request:
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: Hermes revision to validate against
        required: false
        default: main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HERMES_REF: ${{ github.event.inputs.hermes_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked validator environment
        run: uv sync --locked --extra dev

      - name: hermes plugins validate
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=hermes-src .venv/bin/python -m hermes_cli.main plugins validate . --json | tee hermes-validate.json

      - name: Report
        shell: bash
        if: always()
        run: .venv/bin/python scripts/report_hermes_validation.py hermes-validate.json
